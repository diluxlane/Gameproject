<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#161a18" />
    <title>AFTERSIGNAL 2030 · The Awakening</title>
    <meta
      name="description"
      content="A first-person survival mystery at the last receiving station on the East Bank."
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas
      id="world"
      aria-label="East Bank receiving station in three dimensions"
    ></canvas>
    <div id="loading" class="layer">
      <div class="load-card">
        <small>ZYBERLANE XR</small>
        <h1>Acquiring signal</h1>
        <progress id="progress" max="1" value="0"></progress>
        <p id="loadlabel" role="status">Opening the receiving station…</p>
        <button hidden id="retry">Retry loading</button>
      </div>
    </div>
    <header><span class="brandmark">Ⅲ</span> ZYBERLANE <b>XR</b></header>
    <main id="menu" class="layer" hidden>
      <div class="menu-copy">
        <small><i></i> EAST BANK BROADCAST SERVICE</small>
        <h1>AFTERSIGNAL<span>2030</span></h1>
        <p class="subtitle">The Awakening</p>
        <nav>
          <button id="start">New game <b>→</b></button
          ><button id="continue">Continue <b>→</b></button
          ><button id="chapters">Chapters <b>→</b></button
          ><button id="settings">Settings <b>→</b></button>
        </nav>
      </div>
      <footer>
        <span>CHAPTER 01 &nbsp;/&nbsp; SURVIVAL MYSTERY</span
        ><span>RECEIVING STATION 17</span>
      </footer>
    </main>
    <section id="intro" class="layer" hidden>
      <article>
        <small id="date"></small>
        <h2 id="headline"></h2>
        <p id="transcript"></p>
        <button id="next">Advance →</button
        ><button id="skip">Skip prologue</button>
      </article>
    </section>
    <section id="hud" hidden>
      <div class="task">
        <small>FIELD OBJECTIVE</small><strong id="objective"></strong
        ><span id="guide"></span>
      </div>
      <div class="reticle"></div>
      <button id="interact" hidden></button>
      <div id="notice" role="status"></div>
      <div class="vitals">
        <span id="vitals"></span><button id="journal">Field book</button
        ><button id="pause">Pause</button>
      </div>
      <div id="touch">
        <div id="stick" aria-label="Move"><b></b></div>
      </div>
    </section>
    <dialog id="panel">
      <form method="dialog">
        <button aria-label="Close" class="close">×</button>
      </form>
      <small id="panel-kicker">STATION 17</small>
      <h2 id="panel-title"></h2>
      <div id="panel-body"></div>
    </dialog>
    <noscript>Enable JavaScript to play.</noscript>
    <script type="module" src="./game.js"></script>
  </body>
</html>
